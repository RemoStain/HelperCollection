[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "helper-functions"
version = "0.1.0"
description = "A collection of reusable Python helper functions."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Cameron Wise" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["helper_functions*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]

[tool.coverage.run]
source = ["helper_functions"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88